[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "MIT"}
name = "businesslog-agent"
version = "0.2.0"
description = "Business metrics agent for businesslog.ai — PLATO fleet enabled"
requires-python = ">=3.10"
dependencies = [
    "fleet-agent>=0.2.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/businesslog-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["businesslog_agent*"]
